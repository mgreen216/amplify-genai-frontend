name: Docker image build and publish

# ---------------------------------------------------------------------------
# REQUIRED GitHub Actions configuration variables (Settings > Secrets and
# variables > Actions > Variables). These are non-secret client config values.
# Set them at the repository level AND/OR per environment (production /
# development). Environment-scoped vars override repository-scoped vars for
# push/workflow_dispatch runs; pull_request runs get NO environment (see the
# `environment:` expression below), so anything a PR build needs must also
# exist as a repository-level variable.
#
# If a variable is not set, GitHub substitutes an empty string and the image
# silently bakes an EMPTY value into the client bundle (NEXT_PUBLIC_* are
# inlined by `next build` — they cannot be fixed at runtime).
#
# Client config (consumed by the Dockerfile build stage):
#   NEXT_PUBLIC_API_URL             (required — backend API base URL)
#   NEXT_PUBLIC_CHAT_ENDPOINT       (required — amplify-lambda-js Function URL)
#   NEXT_PUBLIC_LLM_ROUTER_ENDPOINT (required — llm-router endpoint)
#   NEXT_PUBLIC_CANVAS_API_URL      (Canvas LMS API base; empty disables Canvas UI)
#   NEXT_PUBLIC_BRAND_NAME
#   NEXT_PUBLIC_CUSTOM_LOGO
#   NEXT_PUBLIC_DEFAULT_THEME
#   NEXT_PUBLIC_MAINTENANCE_MODE    ("true" / "false")
#   NEXT_PUBLIC_FULL_LAUNCH         ("true" / "false")
#   NEXT_PUBLIC_STATUS_PAGE_URL
#
# Infrastructure (already used below):
#   AWS_IAM_ROLE_ARN, AWS_REGION, AWS_ACCOUNT_ID,
#   ECR_REPOSITORY_NAME, ECS_CLUSTER, ECS_SERVICE
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      enable_ecr_workflow:
        description: 'Enable ECR workflow'
        type: boolean
        default: false
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest
    # Only assign environment for push events to main/dev (not for PRs)
    environment: ${{ github.event_name != 'pull_request' && (github.ref_name == 'main' && 'production' || 'development') || '' }}

    permissions:
      id-token: write
      contents: read

    outputs:
      image_tag: ${{ steps.set-outputs.outputs.image_tag }}
      full_image: ${{ steps.set-outputs.outputs.full_image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || true

      - name: Run tests
        run: npm run test -- --run

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          role-session-name: GitHubActions

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: ${{ vars.AWS_ACCOUNT_ID }}

      # Build only (no push) for all PRs
      - name: Build (test only)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          # NEXT_PUBLIC_* are inlined into the client bundle by `next build`,
          # so they MUST be passed at build time. See the header comment for
          # the list of Actions variables that have to be configured.
          # NOTE: pull_request runs have no environment, so these resolve from
          # repository-level variables only.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_CHAT_ENDPOINT=${{ vars.NEXT_PUBLIC_CHAT_ENDPOINT }}
            NEXT_PUBLIC_LLM_ROUTER_ENDPOINT=${{ vars.NEXT_PUBLIC_LLM_ROUTER_ENDPOINT }}
            NEXT_PUBLIC_CANVAS_API_URL=${{ vars.NEXT_PUBLIC_CANVAS_API_URL }}
            NEXT_PUBLIC_BRAND_NAME=${{ vars.NEXT_PUBLIC_BRAND_NAME }}
            NEXT_PUBLIC_CUSTOM_LOGO=${{ vars.NEXT_PUBLIC_CUSTOM_LOGO }}
            NEXT_PUBLIC_DEFAULT_THEME=${{ vars.NEXT_PUBLIC_DEFAULT_THEME }}
            NEXT_PUBLIC_MAINTENANCE_MODE=${{ vars.NEXT_PUBLIC_MAINTENANCE_MODE }}
            NEXT_PUBLIC_FULL_LAUNCH=${{ vars.NEXT_PUBLIC_FULL_LAUNCH }}
            NEXT_PUBLIC_STATUS_PAGE_URL=${{ vars.NEXT_PUBLIC_STATUS_PAGE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and push only for direct pushes to main/dev
      - name: Build and push
        id: build-publish
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY_NAME }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY_NAME }}:latest
          # NEXT_PUBLIC_* are inlined into the client bundle by `next build`,
          # so they MUST be passed at build time — setting them on the ECS task
          # definition has no effect. Values come from the Actions variables
          # listed in the header comment (environment-scoped for main/dev).
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_CHAT_ENDPOINT=${{ vars.NEXT_PUBLIC_CHAT_ENDPOINT }}
            NEXT_PUBLIC_LLM_ROUTER_ENDPOINT=${{ vars.NEXT_PUBLIC_LLM_ROUTER_ENDPOINT }}
            NEXT_PUBLIC_CANVAS_API_URL=${{ vars.NEXT_PUBLIC_CANVAS_API_URL }}
            NEXT_PUBLIC_BRAND_NAME=${{ vars.NEXT_PUBLIC_BRAND_NAME }}
            NEXT_PUBLIC_CUSTOM_LOGO=${{ vars.NEXT_PUBLIC_CUSTOM_LOGO }}
            NEXT_PUBLIC_DEFAULT_THEME=${{ vars.NEXT_PUBLIC_DEFAULT_THEME }}
            NEXT_PUBLIC_MAINTENANCE_MODE=${{ vars.NEXT_PUBLIC_MAINTENANCE_MODE }}
            NEXT_PUBLIC_FULL_LAUNCH=${{ vars.NEXT_PUBLIC_FULL_LAUNCH }}
            NEXT_PUBLIC_STATUS_PAGE_URL=${{ vars.NEXT_PUBLIC_STATUS_PAGE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Set output values
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: set-outputs
        run: |
          echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "full_image=${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY_NAME }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Force new deployment of ECS service
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --service ${{ vars.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ vars.AWS_REGION }}

      - name: Wait for service stability
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          aws ecs wait services-stable \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --services ${{ vars.ECS_SERVICE }} \
            --region ${{ vars.AWS_REGION }}